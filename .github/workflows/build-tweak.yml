name: build-tweak

# 在 GitHub 的 macOS runner 上用 theos 构建插件（产出真正的 arm64e 切片）。
#
# 为什么走这条路:
#   SpringBoard 是 arm64e 进程, 插件必须带 arm64e 切片才加载得进去;
#   而 Windows 侧的交叉工具链 (Zig / LLVM ld64.lld) 产不出合法的 arm64e。
#   GitHub 免费提供 macOS runner, 上面有真正的 clang + ld64。
#
# 目录约定 (重要, 别改乱):
#   tweak/        <- 我们自己的 theos 工程 (Makefile / control)
#   $RUNNER_TEMP/theos  <- 工作流自己克隆的 theos 本体
#   两者必须分开! 第一版就是把 theos 克隆进 worksapce/theos, 和我们自己的
#   theos/ 工程目录撞了, 报 "destination path ... already exists" 直接失败。

on:
  push:
    paths:
      - 'src/**'
      - 'tweak/**'
      - '.github/workflows/build-tweak.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      # theos 本体装到 runner 的临时目录, 和仓库里的 tweak/ 完全分开
      - name: 安装 theos (roothide 分支)
        run: |
          export THEOS="$RUNNER_TEMP/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          rm -rf "$THEOS"
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$THEOS"
          # install-theos 在 macOS 上主要做工具链/ldid 的落地; 失败也继续,
          # 后面构建时如果真缺东西会自己报出来。
          "$THEOS/bin/install-theos" || echo "!! install-theos 返回非 0, 继续尝试构建"
          echo "--- theos 目录 ---"
          ls "$THEOS" | head -20
          echo "--- ldid 是否就位 ---"
          ls -l "$THEOS/bin/ldid" || echo "!! 没有 ldid"
          echo "--- 可用 SDK ---"
          xcrun --sdk iphoneos --show-sdk-version || true

      - name: 准备源码 (theos 工程需要源文件在工程目录里)
        run: |
          cp src/JDClickerSB.m     tweak/JDClickerSB.m
          cp src/JDClickerSB.plist tweak/JDClickerSB.plist
          ls -l tweak/

      # theos 的 "Signing" 这一步要调用 ldid。macOS 上 install-theos 不一定带上它,
      # 实测日志里就是 "/bin/bash: ldid: command not found" 导致构建失败。
      # GitHub 的 macOS runner 预装了 Homebrew, 直接装一个。
      - name: 准备 ldid (签名用)
        run: |
          export PATH="$THEOS/bin:$PATH"
          if command -v ldid >/dev/null 2>&1; then
            echo "ldid 已就位: $(command -v ldid)"
          else
            echo "theos 没带上 ldid, 用 Homebrew 装"
            brew install ldid || echo "!! brew install ldid 失败"
          fi
          if command -v ldid >/dev/null 2>&1; then
            echo "LDID_OK=1" >> "$GITHUB_ENV"
            ldid -v 2>&1 | head -3 || true
          else
            echo "LDID_OK=0" >> "$GITHUB_ENV"
            echo "!! 仍然没有 ldid, 构建时会跳过签名"
          fi

      - name: 构建 (隐根 + 无根)
        run: |
          cd tweak
          # 没有 ldid 时的兜底: 让 theos 把 "签名" 换成一条 echo。
          # 隐根环境下未签名的 dylib 一样能加载 —— roothide 自己的 Bootstrap
          # 就是 TARGET_CODESIGN = echo "don't sign"。
          SIGN_ARG=""
          if [ "$LDID_OK" != "1" ]; then
            echo "!! 无 ldid, 本次用 TARGET_CODESIGN=echo 跳过签名"
            SIGN_ARG="TARGET_CODESIGN=echo"
          fi
          rc=0
          for scheme in roothide rootless; do
            echo "===================== scheme=$scheme ====================="
            make clean || true
            make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=$scheme $SIGN_ARG || rc=1
          done
          echo "--- 产出 ---"
          ls -l packages/ || true
          exit $rc

      # 校验不用 dpkg-deb: macOS runner 上没有这个命令 (它是 Debian 的工具),
      # 实测会以 "dpkg-deb: command not found" 让整步失败。
      # 这里用 python3 (macOS runner 自带) 直接解析 .deb 的 ar/tar 结构。
      - name: 校验产物 (切片必须有 arm64 和 arm64e; 且不应有 Depends)
        if: always()
        run: |
          cd tweak
          echo "--- packages/ ---"
          ls -l packages/ || true
          python3 << 'PY'
          import glob, io, os, struct, sys, tarfile

          CPU = {0x0100000C: "arm64", 0x0200000C: "arm64_32", 0x01000007: "x86_64"}
          SUB = {0: "ALL", 1: "V8", 2: "ARM64E"}

          def arch_name(ct, cs):
              # arm64 和 arm64e 的 **cputype 完全相同** (都是 0x0100000C),
              # 只有 cpusubtype 不同 (0 = arm64, 2 = arm64e)。
              # 所以架构名必须由 (cputype, cpusubtype) 共同决定 —— 只看 cputype
              # 会把一个正确的双切片 dylib 误判成"缺 arm64e"。
              sub = cs & 0xFFFFFF
              if ct == 0x0100000C:
                  return {0: "arm64", 1: "arm64v8", 2: "arm64e"}.get(sub, f"arm64.sub{sub}")
              if ct == 0x0200000C:
                  return "arm64_32"
              if ct == 0x01000007:
                  return "x86_64"
              return f"cpu0x{ct:08X}.sub{sub}"

          def ar_members(blob):
              if not blob.startswith(b"!<arch>\n"):
                  raise ValueError("不是 ar 归档")
              pos, out = 8, []
              while pos + 60 <= len(blob):
                  hdr = blob[pos:pos + 60]
                  name = hdr[0:16].decode("ascii", "replace").strip().rstrip("/")
                  size = int(hdr[48:58].decode("ascii").strip())
                  pos += 60
                  out.append((name, blob[pos:pos + size]))
                  pos += size + (size % 2)
              return out

          def slices(data):
              # 注意字节序: fat 头的魔数 CAFEBABE 是**大端**的。
              # 之前用 "<I" 读再和 0xCAFEBABE 比, 永远不相等 -> fat 分支进不去,
              # 会把一个正确的双切片 dylib 误判成 cputype=0x02000000 (那其实是 nfat_arch)。
              be = struct.unpack_from(">I", data, 0)[0]
              if be == 0xCAFEBABE:                          # fat (32 位 fat_arch)
                  n = struct.unpack_from(">I", data, 4)[0]
                  return [struct.unpack_from(">ii", data, 8 + i * 20) for i in range(n)]
              if be == 0xCAFEBABF:                          # fat64
                  n = struct.unpack_from(">I", data, 4)[0]
                  return [struct.unpack_from(">ii", data, 8 + i * 32) for i in range(n)]
              le = struct.unpack_from("<I", data, 0)[0]
              if le in (0xFEEDFACE, 0xFEEDFACF):            # 小端 thin (正常的 arm64/arm64e)
                  return [struct.unpack_from("<ii", data, 4)]
              return [struct.unpack_from(">ii", data, 4)]   # 大端 thin (理论上不出现)

          def member(tf, *cands):
              names = tf.getnames()
              for c in cands:
                  if c in names:
                      return tf.extractfile(c).read()
              return None

          debs = sorted(glob.glob("packages/*.deb"))
          if not debs:
              print("!! packages/ 里没有 deb")
              sys.exit(1)

          ok = True
          for deb in debs:
              print("=" * 66)
              print(deb)
              mem = dict(ar_members(open(deb, "rb").read()))
              ctrl_name = next((n for n in mem if n.startswith("control.tar")), None)
              data_name = next((n for n in mem if n.startswith("data.tar")), None)
              if not ctrl_name or not data_name:
                  print(f"!! ar 成员不对: {list(mem)}")
                  ok = False
                  continue

              with tarfile.open(fileobj=io.BytesIO(mem[ctrl_name]), mode="r:*") as tf:
                  ctrl = (member(tf, "./control", "control") or b"").decode("utf-8", "replace")
              print("--- control ---")
              print(ctrl.strip())
              deps = [l for l in ctrl.splitlines()
                      if l.lower().startswith("depends:") and l.split(":", 1)[1].strip()]
              if deps:
                  print(f"!! control 里还有非空 Depends: {deps}")
                  ok = False

              with tarfile.open(fileobj=io.BytesIO(mem[data_name]), mode="r:*") as tf:
                  dylibs = [n for n in tf.getnames() if n.endswith(".dylib")]
                  print(f"--- data --- {dylibs}")
                  if not dylibs:
                      print("!! data.tar 里没有 dylib")
                      ok = False
                  for n in dylibs:
                      raw = tf.extractfile(n).read()
                      got = slices(raw)
                      print(f"--- 切片: {n}  ({len(raw)} 字节) ---")
                      archs = set()
                      for ct, cs in got:
                          name = arch_name(ct, cs)
                          archs.add(name)
                          sub = cs & 0xFFFFFF
                          print(f"    cputype=0x{ct:08X} ({CPU.get(ct, '?')})"
                                f"  cpusubtype={sub} ({SUB.get(sub, '?')})"
                                f"  ->  {name}")
                      missing = {"arm64", "arm64e"} - archs
                      if missing:
                          print(f"    !! 缺少切片: {sorted(missing)}")
                          ok = False

          print("=" * 66)
          print("结论: " + ("切片与 control 都正确 ✓" if ok else "存在问题 ✗"))
          sys.exit(0 if ok else 1)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jdclickersb-debs
          path: tweak/packages/*.deb
          if-no-files-found: warn
